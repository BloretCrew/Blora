[versions]
kotlin = '2.1.20'
kotlinx = '1.10.2'
datetime = '0.7.1-0.6.x-compat'
serialization = '1.8.1'
tomlkt = '0.4.0'
advkt = '2.1.2'
paper = '1.21.8-R0.1-SNAPSHOT'
paperweight = '2.0.0-beta.17'
exposed = "0.61.0"
velocity = "3.4.0-SNAPSHOT"
hikaricp = "6.3.0"
okhttp3 = "4.12.0"
netty = "4.2.2.Final"
knbt = "0.11.8"
mariadb = "3.5.3"
minedown = "1.7.4-SNAPSHOT"
papi = "2.11.6"
craft-engine = "0.0.59"
adventure = "4.23.0"
playerpoints = "3.3.3-SNAPSHOT"
postgresql = "42.7.7"
krontab = "2.7.2"
aurora-lib = "2.1.6"
aurora-levels = "2.0.0"
xconomy = "2.25.1"

[libraries]
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = 'velocity' }
velocity-proxy = { module = "com.velocitypowered:velocity-proxy", version.ref = 'velocity' }
paper-api = { module = 'io.papermc.paper:paper-api', version.ref = 'paper' }
kotlinx-coroutines = { group = 'org.jetbrains.kotlinx', name = 'kotlinx-coroutines-core-jvm', version.ref = 'kotlinx' }
kotlinx-datetime = { group = 'org.jetbrains.kotlinx', name = 'kotlinx-datetime-jvm', version.ref = 'datetime' }
kotlinx-serialization-core = { group = 'org.jetbrains.kotlinx', name = 'kotlinx-serialization-core', version.ref = 'serialization' }
kotlinx-serialization-json = { group = 'org.jetbrains.kotlinx', name = 'kotlinx-serialization-json', version.ref = 'serialization' }
tomlkt = { group = 'net.peanuuutz.tomlkt', name = 'tomlkt', version.ref = 'tomlkt' }
knbt = { module = 'net.benwoodworth.knbt:knbt', version.ref = 'knbt' }
advkt = { module = 'plutoproject.adventurekt:core', version.ref = 'advkt' }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-javatime = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3" }
netty = { module = "io.netty:netty-all", version.ref = "netty" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
minedown = { module = "de.themoep:minedown-adventure", version.ref = "minedown" }
papi = { module = "me.clip:placeholderapi", version.ref = "papi" }
craftengine-core = { module = "net.momirealms:craft-engine-core", version.ref = "craft-engine" }
craftengine-bukkit = { module = "net.momirealms:craft-engine-bukkit", version.ref = "craft-engine" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }
playerpoints = { module = "org.black_ixx:playerpoints", version.ref = "playerpoints" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
krontab = { module = "dev.inmo:krontab", version.ref = "krontab" }
aurora-lib = { module = "gg.auroramc:Aurora", version.ref = "aurora-lib" }
aurora-levels = { module = "gg.auroramc:AuroraLevels", version.ref = "aurora-levels" }
xconomy = { module = "com.github.YiC200333:XConomyAPI", version.ref = "xconomy" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.0.0-beta16" }
kotlin-jvm = { id = 'org.jetbrains.kotlin.jvm', version.ref = 'kotlin' }
kotlin-kapt = { id = 'org.jetbrains.kotlin.kapt', version.ref = 'kotlin' }
kotlin-plugin-serialization = { id = 'org.jetbrains.kotlin.plugin.serialization', version.ref = 'kotlin' }
paperweight-userdev = { id = 'io.papermc.paperweight.userdev', version.ref = "paperweight" }